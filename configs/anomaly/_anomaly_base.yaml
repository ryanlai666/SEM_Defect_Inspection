_base_: ../base.yaml
task: anomaly
tracking: {experiment: anomaly}
train:
  batch_size: 8
  k_normal: null           # few-shot AD: number of normal reference images (null = all train normals)
  k_seed: 0
  augment: false
memory:
  offmask_images: 0        # >0: add patches far from masks of this many train defect images (memory-bank models)
  margin_px: 16
  save_memory_bank: true   # FP16 bank only (PatchCore ~28 MB; AnomalyDINO full bank ~430 MB)
eval:
  eval_size: 224           # common resolution for pixel AUROC / AUPRO
  batch_size: 8
robustness:
  enabled: false
  perturbations: [shot_noise, blur, charging]
  levels: [1, 3, 5]
